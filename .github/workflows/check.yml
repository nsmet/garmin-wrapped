name: Release checks
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: track-record-stories
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: track-record-stories/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check -- --public
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Run browser tests with the preinstalled browsers
        timeout-minutes: 22
        run: npm run test:e2e -- --global-timeout=1200000
      - run: npm run deploy:cloudflare:dry-run
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failures
          path: track-record-stories/test-results/
          retention-days: 7
