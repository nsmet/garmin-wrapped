name: Deploy Garmin Wrapped to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: track-record-stories
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: track-record-stories/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare metadata access
        run: node scripts/check-cloudflare-access.mjs
      - name: Build production Worker
        run: npm run build:cloudflare
      - name: Deploy production Worker
        run: npm run deploy:cloudflare:built
