<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Garmin Wraped icon: the MINI WATT bolt in dots</title>
<!--
  Renders the app icon at ?size=N (default 512). ?round=0 draws a square tile (for apple-touch-icon,
  which iOS masks itself). The bolt is the miniwatt.app logo sampled into dot grids: finer grids for
  big sizes, coarser ones for small sizes so the shape survives at 16-32 px.
  Screenshot #icon at size x size to export a PNG. public/favicon.svg is the same 8-column grid as SVG.
-->
<style>html,body{margin:0;background:transparent}#icon{position:relative;overflow:hidden}</style>
<div id="icon"></div>
<script>
const q = new URLSearchParams(location.search);
const S = +(q.get('size') || 512), round = q.get('round') !== '0';
const BOLT = {
  18: '000000000000000000,000000000001000000,000000000011000000,000000000111000000,000000000111000000,000000001111000000,000000011111000000,000000111011000000,000001111011100000,000001110011111110,000011100011111110,000111000000011100,001110000000111000,011111110001110000,011111110011110000,000001110011100000,000000110111000000,000000111110000000,000000111100000000,000000111000000000,000000111000000000,000000110000000000,000000100000000000,000000000000000000',
  12: '000000000000,000000010000,000000110000,000001110000,000011110000,000011010000,000110011111,001100001110,011100001100,111110011000,000110110000,000011110000,000011100000,000011000000,000010000000,000000000000',
  8: '00000000,00001100,00011100,00011100,00101111,01100110,11110100,00111000,00110000,00110000,00000000'
};
const tier = S >= 160 ? 0 : S >= 64 ? 1 : S >= 32 ? 2 : 3;
const key = tier === 0 ? 18 : tier === 1 ? 12 : 8;
const mix = (a, b, f) => '#' + [1, 3, 5].map(k => Math.round(parseInt(a.substr(k, 2), 16) * (1 - f) + parseInt(b.substr(k, 2), 16) * f).toString(16).padStart(2, '0')).join('');
const el = document.getElementById('icon');
el.style.cssText += `width:${S}px;height:${S}px;border-radius:${round ? S * 0.225 : 0}px;background:radial-gradient(circle at 50% 42%,#1A2645 0%,#0B1222 72%)`;
const rows = BOLT[key].split(','), R = rows.length, C = rows[0].length;
const p = 0.74 / R, x0 = 0.5 - C * p / 2, y0 = 0.5 - R * p / 2;
rows.forEach((row, ri) => row.split('').forEach((b, ci) => {
  const cx = x0 + (ci + 0.5) * p, cy = y0 + (ri + 0.5) * p;
  let d, c, o = 1, glow = false;
  if (b === '1') {
    const f = Math.min(1, Math.hypot(cx - 0.5, (cy - 0.5) * 0.8) / 0.34);
    d = p * (tier === 3 ? 1.15 : tier === 2 ? 0.95 : 0.78); c = mix('#FFD98A', '#FE9A0C', f); glow = tier <= 1;
  } else if (tier === 0) { d = p * 0.22; c = '#5B6C98'; o = 0.45; } else return;
  const px = d * S, dot = document.createElement('div');
  dot.style.cssText = `position:absolute;left:${cx * S - px / 2}px;top:${cy * S - px / 2}px;width:${px}px;height:${px}px;border-radius:50%;background:${c};opacity:${o};box-shadow:${glow ? `0 0 ${px * 1.3}px ${c}` : 'none'}`;
  el.appendChild(dot);
}));
window.ready = true;
</script>
</html>
