<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Garmin Wraped social preview artwork</title>
<!--
  1200 x 630 share image. The three cards are real renders of the busy fictional sample year
  (renderShareCard on sample-full-hiking-sessions, -running-sessions, -cycling-sessions), saved in
  social-cards/. No personal recap data. Render at 1200 x 630 once fonts and images load,
  export as JPEG quality 85 to public/social-preview.jpg.
-->
<style>
  @font-face{font-family:'Sora';font-weight:400;src:url('../public/assets/fonts/sora-latin-400-normal.woff2') format('woff2')}
  @font-face{font-family:'Sora';font-weight:600;src:url('../public/assets/fonts/sora-latin-600-normal.woff2') format('woff2')}
  @font-face{font-family:'Sora';font-weight:800;src:url('../public/assets/fonts/sora-latin-800-normal.woff2') format('woff2')}
  *{box-sizing:border-box}
  body{margin:0;width:1200px;height:630px;position:relative;overflow:hidden;background:#0B1222;color:#fff;font-family:'Sora',Arial,sans-serif}
  .glow{position:absolute;left:560px;top:10px;width:660px;height:620px;background:radial-gradient(closest-side,rgba(127,224,168,.12),rgba(11,18,34,0))}
  .copy{position:absolute;left:72px;top:64px;bottom:60px;width:530px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:14px}
  .wordmark{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid rgba(207,221,245,.45);font-size:12px;font-weight:600}
  .chip b{font-weight:800}
  h1{margin:64px 0 0;font-size:60px;line-height:.98;font-weight:800;letter-spacing:-.045em}
  h1 span{color:#FFB35C}
  p{margin:24px 0 0;font-size:22px;line-height:1.45;color:#B9C5DE;max-width:460px;font-weight:400}
  .url{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:999px;background:#fff;color:#0B1222;font-size:17px;font-weight:800}
  img{position:absolute;object-fit:cover}
  .side{width:228px;height:405px;top:132px;border-radius:18px;border:1px solid rgba(207,221,245,.16);box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .left{left:640px;transform:rotate(-9deg)}
  .right{left:934px;transform:rotate(9deg)}
  .front{left:785px;top:98px;width:244px;height:434px;border-radius:20px;border:1px solid rgba(207,221,245,.24);box-shadow:0 30px 70px rgba(0,0,0,.6)}
</style>
<div class="glow"></div>
<div class="copy">
  <div class="brand">
    <span class="wordmark">GARMIN WRAPED</span>
    <span class="chip">a <b>MINI WATT</b> product <svg width="9" height="11" viewBox="0 0 10 12"><path d="M6 0 0 7h4l-1 5 6-7H5z" fill="#FFB35C"/></svg></span>
  </div>
  <h1>Your Garmin year,<br><span>wrapped.</span></h1>
  <p>Story cards made from your own activities. One dot per activity.</p>
  <span class="url">garmin-wrapped.miniwatt.app <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
</div>
<img class="side left" src="social-cards/running.jpg" alt="">
<img class="side right" src="social-cards/cycling.jpg" alt="">
<img class="front" src="social-cards/hiking.jpg" alt="">
</html>
